name: Apply core boot repair

on:
  push:
    branches:
      - hotfix/core-boot-repair-v0.17.4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore missing core controller block
        run: python tools/restore_core_boot.py

      - name: Verify boot structure and JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path('index.html').read_text()
          required = [
              'const VIEW_DEPENDENCIES = {',
              'function refreshAllViews()',
              'function renderHouseholdLabels()',
              'function renderTempRuleWeekdayChecks()',
              'function openSettings()',
              'function saveHouseholdSettings()',
              'function openRealityModal()',
              'function exportLocalSetup()',
              'Core Boot Repair v0.17.4',
              "appVersion:'0.17.4'",
              'renderHouseholdLabels();\n  renderAll();',
              'setTimeout(runLogicDiagnosticsSafely,0);'
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit('Missing required boot markers: ' + ', '.join(missing))

          unique = [
              'const VIEW_DEPENDENCIES = {',
              'function refreshAllViews()',
              'function renderHouseholdLabels()',
              'function renderTempRuleWeekdayChecks()',
              'function openSettings()',
          ]
          duplicates = [(x, html.count(x)) for x in unique if html.count(x) != 1]
          if duplicates:
              raise SystemExit('Unexpected duplicate/missing restored symbols: ' + repr(duplicates))

          script_parts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not script_parts:
              raise SystemExit('No inline script found')
          Path('/tmp/loochori-inline.js').write_text('\n'.join(script_parts))
          PY
          node --check /tmp/loochori-inline.js
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'v0.17.4 restore core boot controllers'
          git push
