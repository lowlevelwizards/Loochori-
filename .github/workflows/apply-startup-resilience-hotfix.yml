name: Apply startup resilience hotfix

on:
  push:
    branches:
      - hotfix/startup-resilience-v0.17.3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        run: python tools/apply_startup_resilience_hotfix.py

      - name: Verify script syntax and hotfix structure
        shell: bash
        run: |
          python -c "import re,pathlib; h=pathlib.Path('index.html').read_text(); s=re.findall(r'<script>(.*?)</script>',h,re.S); assert s; pathlib.Path('/tmp/loochori-inline.js').write_text(chr(10).join(s))"
          node --check /tmp/loochori-inline.js
          grep -Fq "function runLogicDiagnosticsSafely()" index.html
          grep -Fq "setTimeout(runLogicDiagnosticsSafely,0);" index.html
          grep -Fq "Startup Resilience v0.17.3" index.html
          git diff --check

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'v0.17.3 startup resilience'
          git push
