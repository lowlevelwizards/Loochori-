name: Apply v0.18.1 Today shortlist

on:
  push:
    branches: [feature/today-shortlist-v0.18.1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/today-shortlist-v0.18.1
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply_v0181.py

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/loochori-inline.js').write_text('\n'.join(scripts))
          assert 'Today Shortlist v0.18.1' in html
          assert 'loochori_today_intent_v1' in html
          assert 'renderTodayShortlist' in html
          assert 'Keep today' in html
          PY
          node --check /tmp/loochori-inline.js
          node --check tests/boot-smoke.mjs
          git diff --check

      - name: Remove one-shot patcher
        run: rm tools/apply_v0181.py .github/workflows/apply-v0181.yml

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.18.1 Today Shortlist"
          git push origin HEAD:feature/today-shortlist-v0.18.1
