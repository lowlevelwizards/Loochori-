name: Apply v0.18.2 Plan Today

on:
  push:
    branches: [feature/plan-today-v0.18.2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/plan-today-v0.18.2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply Plan Today patch
        shell: bash
        run: |
          if grep -q 'Plan Today v0.18.2' index.html; then
            echo 'Plan Today implementation already applied.'
          else
            python tools/apply_v0182.py
          fi

      - name: Normalize planner contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          html = index_path.read_text()
          old_snapshot = """        score:candidate.adaptiveScore,\n        intent:Boolean(candidate.intent)\n      }))"""
          new_snapshot = """        score:candidate.adaptiveScore,\n        intent:Boolean(candidate.intent),\n        intentOrder:candidate.intent ? Number(candidate.intentOrder)||0 : null\n      }))"""
          if new_snapshot not in html:
              if html.count(old_snapshot) != 1:
                  raise SystemExit(f'adaptive debug snapshot anchor count: {html.count(old_snapshot)}')
              html = html.replace(old_snapshot, new_snapshot, 1)
          index_path.write_text(html)

          test_path = Path('tests/boot-smoke.mjs')
          test = test_path.read_text()
          old_carry = """  const keepCarry = page.locator('#carryoverPanel .carryoverItem').filter({ hasText: 'Smoke carryover loop' }).getByRole('button', { name: 'Keep today' });\n  await keepCarry.click();\n  await page.waitForFunction(() =>\n    Array.from(document.querySelectorAll('#todayShortlist .todayShortlistTitle')).some(node => node.textContent?.includes('Smoke carryover loop'))\n  );\n  intentState = await page.evaluate(() => JSON.parse(localStorage.getItem('loochori_today_intent_v1') || '{}'));"""
          new_carry = """  const keepCarry = page.locator('#carryoverPanel .carryoverItem').filter({ hasText: 'Smoke carryover loop' }).getByRole('button', { name: 'Keep today' });\n  await keepCarry.click();\n  await page.waitForFunction(() => {\n    const state = JSON.parse(localStorage.getItem('loochori_today_intent_v1') || '{}');\n    return Object.values(state).flat().some(item => item.refId === 'loop_carry' && item.carriedFrom);\n  });\n  assert((await text('#todayShortlistMore')).includes('more chosen for today'), 'overflow shortlist count did not reflect kept carryover');\n  intentState = await page.evaluate(() => JSON.parse(localStorage.getItem('loochori_today_intent_v1') || '{}'));"""
          if new_carry not in test:
              if test.count(old_carry) != 1:
                  raise SystemExit(f'carryover smoke anchor count: {test.count(old_carry)}')
              test = test.replace(old_carry, new_carry, 1)
          test_path.write_text(test)
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline JavaScript found')
          Path('/tmp/loochori-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/loochori-inline.js
          node --check tests/boot-smoke.mjs
          git diff --check

      - name: Install Chromium test runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/loochori-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/loochori-http.log
          exit 1

      - name: Run browser contract
        env:
          LOOCHORI_TEST_URL: http://127.0.0.1:4173/index.html
        run: node tests/boot-smoke.mjs

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet -- index.html tests/boot-smoke.mjs; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/boot-smoke.mjs
          git commit -m "v0.18.2 Plan Today"
          git push origin HEAD:feature/plan-today-v0.18.2
