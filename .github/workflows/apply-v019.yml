name: Apply v0.19 Cozy Home

on:
  push:
    branches: [feature/cozy-home-v0.19.0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/cozy-home-v0.19.0
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply Cozy Home patch
        run: python tools/apply_v019.py

      - name: Adapt browser flow for collapsed sections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/boot-smoke.mjs')
          text=p.read_text()

          needle="  assert.equal(await page.locator('#careArea').evaluate(el => el.open), false, 'opening meals should close care');"
          wait="  await page.waitForFunction(() => !document.getElementById('careArea')?.open && document.getElementById('mealsArea')?.open);"
          if text.count(needle)!=1:
            raise SystemExit('accordion smoke anchor not found exactly once')
          text=text.replace(needle, wait+'\n'+needle, 1)

          loop_anchor="  const loopToday = page.locator('button[data-intent-kind=\"loop\"][data-intent-ref=\"loop_smoke\"]:visible');"
          open_house="  await page.locator('#houseArea > summary').click();\n  await page.waitForFunction(() => document.getElementById('houseArea')?.open);\n"
          if text.count(loop_anchor)!=1:
            raise SystemExit('open-loop smoke anchor not found exactly once')
          text=text.replace(loop_anchor, open_house+loop_anchor, 1)

          p.write_text(text)
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
            raise SystemExit('No inline JavaScript found')
          Path('/tmp/loochori-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/loochori-inline.js
          node --check tests/boot-smoke.mjs
          git diff --check

      - name: Install Chromium test runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/loochori-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/loochori-http.log
          exit 1

      - name: Run browser contract
        env:
          LOOCHORI_TEST_URL: http://127.0.0.1:4173/index.html
        run: node tests/boot-smoke.mjs

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/apply_v019.py tools/rerun_v019.txt .github/workflows/apply-v019.yml
          git add -A
          git commit -m "v0.19.0 Cozy Home"
          git push origin HEAD:feature/cozy-home-v0.19.0
