name: Apply v0.20.1 Personal Rhythm Memory

on:
  push:
    branches: [feature/personal-rhythm-memory-v0.20.1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/personal-rhythm-memory-v0.20.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Personal Rhythm Memory patch
        run: python tools/apply_v0201_memory.py
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text()
          Path('/tmp/app.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',html,flags=re.S)))
          PY
          node --check /tmp/app.js
          node --check sw.js
          node --check tests/boot-smoke.mjs
          git diff --check
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep .25; done
          cat /tmp/http.log; exit 1
      - name: Run browser contract
        env:
          LOOCHORI_TEST_URL: http://127.0.0.1:4173/index.html
        run: node tests/boot-smoke.mjs
      - name: Commit implementation only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf node_modules package-lock.json package.json
          git rm -f tools/apply_v0201_memory.py .github/workflows/apply-v0201-memory.yml
          git add index.html sw.js tests/boot-smoke.mjs
          git status --short
          git commit -m "Implement Personal Rhythm Memory v0.20.1"
          git push origin HEAD:feature/personal-rhythm-memory-v0.20.1
