name: Apply v0.20.2 What Actually Happened

on:
  push:
    branches:
      - feature/what-actually-happened-v0.20.2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/what-actually-happened-v0.20.2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply v0.20.2 patch
        run: python3 tools/apply_v0202.py

      - name: Parse application JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S)
          if not scripts:
              raise SystemExit('No inline JavaScript found')
          Path('/tmp/loochori-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/loochori-inline.js
          node --check sw.js
          node --check tests/boot-smoke.mjs

      - name: Install Chromium test runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/loochori-http.log 2>&1 &
          echo $! > /tmp/loochori-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/loochori-http.log
          exit 1

      - name: Run browser contract
        env:
          LOOCHORI_TEST_URL: http://127.0.0.1:4173/index.html
        run: node tests/boot-smoke.mjs

      - name: Commit intended files and remove helpers
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          git config user.name "lowlevelwizards"
          git config user.email "157194489+lowlevelwizards@users.noreply.github.com"
          git add index.html tests/boot-smoke.mjs
          git rm tools/apply_v0202.py .github/workflows/apply-v0202.yml
          git status --short
          git commit -m "v0.20.2 What Actually Happened"
          git push origin HEAD:feature/what-actually-happened-v0.20.2
