name: Apply v0.20.4 Cozy Clarity

on:
  push:
    branches:
      - feature/cozy-clarity-v0.20.4
    paths:
      - tools/apply_v0204_cozy_clarity.py
      - .github/workflows/apply-v0204-cozy-clarity.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/cozy-clarity-v0.20.4
          fetch-depth: 0

      - name: Apply Cozy Clarity patch
        run: python tools/apply_v0204_cozy_clarity.py

      - name: Parse changed JavaScript sources
        run: |
          node --check sw.js
          node --check tests/boot-smoke.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/loochori-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/loochori-inline.js

      - name: Remove one-shot helper
        run: |
          rm tools/apply_v0204_cozy_clarity.py
          rm .github/workflows/apply-v0204-cozy-clarity.yml

      - name: Commit implementation only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js tests/boot-smoke.mjs tools/apply_v0204_cozy_clarity.py .github/workflows/apply-v0204-cozy-clarity.yml
          git commit -m 'v0.20.4 Cozy Clarity'
          git push origin HEAD:feature/cozy-clarity-v0.20.4
