name: Apply v0.20.5 Things to Get

on:
  push:
    branches:
      - feature/things-to-get-v0.20.5
    paths:
      - 'tools/apply_v0205_things_to_get.py'
      - '.github/workflows/apply-v0205-things-to-get.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/things-to-get-v0.20.5
          fetch-depth: 0

      - name: Apply Things to Get patch
        run: python tools/apply_v0205_things_to_get.py

      - name: Parse changed JavaScript sources
        run: |
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
          if not scripts:
              raise SystemExit('no inline scripts found')
          for i,script in enumerate(scripts):
              p=Path(tempfile.gettempdir())/f'loochori-inline-{i}.js'
              p.write_text(script)
              subprocess.run(['node','--check',str(p)],check=True)
          PY
          node --check tests/boot-smoke.mjs

      - name: Remove one-shot helper
        run: |
          rm tools/apply_v0205_things_to_get.py
          rm .github/workflows/apply-v0205-things-to-get.yml

      - name: Commit implementation only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js tests/boot-smoke.mjs tools/apply_v0205_things_to_get.py .github/workflows/apply-v0205-things-to-get.yml
          git commit -m 'v0.20.5 Things to Get'
          git push origin HEAD:feature/things-to-get-v0.20.5
