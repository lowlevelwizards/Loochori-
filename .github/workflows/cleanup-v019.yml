name: Cleanup v0.19 temporary test dependencies

on:
  push:
    branches: [feature/cozy-home-v0.19.0]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cozy-home-v0.19.0
          fetch-depth: 0
      - name: Remove temporary dependency tree
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          rm -f .github/workflows/cleanup-v019.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean v0.19 temporary test dependencies"
          git push origin HEAD:feature/cozy-home-v0.19.0
