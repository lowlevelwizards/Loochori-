name: Fix v0.20.5 gate

on:
  push:
    branches:
      - feature/things-to-get-v0.20.5
    paths:
      - 'tools/fix_v0205_gate.py'
      - '.github/workflows/fix-v0205-gate.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/things-to-get-v0.20.5
          fetch-depth: 0
      - name: Apply fix
        run: python tools/fix_v0205_gate.py
      - name: Parse sources
        run: |
          node --check sw.js
          node --check tests/boot-smoke.mjs
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text()
          for i,script in enumerate(re.findall(r'<script>(.*?)</script>',html,re.S)):
              p=Path(tempfile.gettempdir())/f'loochori-v0205-fix-{i}.js'
              p.write_text(script)
              subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Remove helper
        run: |
          rm tools/fix_v0205_gate.py
          rm .github/workflows/fix-v0205-gate.yml
      - name: Commit fix only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/boot-smoke.mjs tools/fix_v0205_gate.py .github/workflows/fix-v0205-gate.yml
          git commit -m 'Fix v0.20.5 release contract'
          git push origin HEAD:feature/things-to-get-v0.20.5
