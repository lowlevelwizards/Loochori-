name: Fix v0.20.5 household test

on:
  push:
    branches:
      - feature/things-to-get-v0.20.5
    paths:
      - '.github/workflows/fix-v0205-house-test.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/things-to-get-v0.20.5
          fetch-depth: 0
      - name: Fix household visibility in browser contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/boot-smoke.mjs')
          s=p.read_text()
          old="  assert((await text('#thingsToGetSummary')).includes('pick up'), 'Household Things to get summary did not surface shopping need');\n  await page.locator('#openThingsToGetBtn').click();"
          new="  assert((await text('#thingsToGetSummary')).includes('pick up'), 'Household Things to get summary did not surface shopping need');\n  await page.locator('#houseArea > summary').click();\n  await page.waitForFunction(() => document.getElementById('houseArea')?.open);\n  await page.locator('#openThingsToGetBtn').click();"
          if old not in s:
              raise SystemExit('Things to Get visibility test anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/boot-smoke.mjs
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-v0205-house-test.yml
      - name: Commit test fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/boot-smoke.mjs .github/workflows/fix-v0205-house-test.yml
          git commit -m 'Fix Things to Get household browser contract'
          git push origin HEAD:feature/things-to-get-v0.20.5
