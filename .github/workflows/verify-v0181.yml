name: Verify v0.18.1 Today shortlist

on:
  push:
    branches: [feature/today-shortlist-v0.18.1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Today shortlist browser contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/today-shortlist-v0.18.1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parse inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline JavaScript found in index.html')
          Path('/tmp/loochori-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/loochori-inline.js
          node --check tests/boot-smoke.mjs
          git diff --check

      - name: Install Chromium test runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start local Loochori server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/loochori-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/loochori-http.log
          exit 1

      - name: Run full browser contract
        env:
          LOOCHORI_TEST_URL: http://127.0.0.1:4173/index.html
        run: node tests/boot-smoke.mjs

      - name: Remove one-shot verifier after success
        shell: bash
        run: |
          rm .github/workflows/verify-v0181.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean v0.18.1 verification workflow"
          git push origin HEAD:feature/today-shortlist-v0.18.1
